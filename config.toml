# Band Screener settings.
# Edit and commit; the next weekly run picks the changes up.

[signal]
bb_period = 20             # number of quarterly bars in the Bollinger calculation
bb_std = 2.0               # standard deviations either side of the average
proximity_threshold = 0.10 # "close" = the low is within 10% above the lower band (or below it)
week_lookback_days = 5     # trading days that make up "this week"
band_mode = "live"         # "live": the unfinished quarter is the latest bar (like a chart today)
                           # "frozen": bands use completed quarters only

[sell]
proximity_threshold = 0.10 # Sell tab: a holding shows when its HIGH is within 10% below the upper band, or above it

[rsi]
period = 14                # RSI is measured on the same quarterly closes as the bands
oversold = 30              # at or below this the stock is tagged "RSI oversold"
overbought = 70            # at or above this the stock is tagged "RSI overbought"

[targets]
file = "data/targets.txt"  # your own target buy / sell prices and per-tab hiding (public file)
edit_url = "https://github.com/MegaColab/band-screener/edit/main/data/targets.txt"  # link shown on the page

[liquidity]
window_days = 60                  # average daily traded value over this many sessions
min_avg_daily_value_us = 5000000  # USD. Stocks below this are flagged, never removed
min_avg_daily_value_au = 1000000  # AUD. Stocks below this are flagged, never removed

[data]
history_years = 6          # 20 quarterly bars need about 5 years; 6 leaves headroom
batch_size = 80            # tickers per Yahoo Finance request
min_success_ratio = 0.80   # abort the run (keep the old dashboard) if fewer tickers than this load

[universe]
asx200_file = "data/asx200.csv"
asx200_max_age_days = 100      # warn on the dashboard when the ASX list is older than this
sp500_cache_file = "data/sp500_cache.csv"
holdings_file = "data/holdings.txt"  # tickers for the Sell tab (public: tickers only)
etf_file = "data/etfs.txt"           # tickers to tag as ETFs, for the Type filter on both tabs

[output]
dir = "docs"
keep_history = true        # write a small hits-only file per run to docs/data/history/
