name: Weekly screen

on:
  schedule:
    # Fridays 23:17 UTC = Saturday morning in Sydney, after the US and ASX Friday closes.
    - cron: "17 23 * * 5"
  workflow_dispatch: # lets you run it by hand from the Actions tab (works from a phone)

permissions:
  contents: write # the run commits the refreshed dashboard back to the repo

concurrency:
  group: publish-docs  # shared with the daily sell watch so two runs never write docs/ at once
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Screen the market
        run: python -m bandscreener run
        env:
          PYTHONPATH: src

      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Weekly screen $(date -u +%F)"
            git pull --rebase
            git push
          fi
